name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, staging/sprint-1]
  pull_request:
    branches: [main, staging/sprint-1]

env:
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_management_test?schema=public
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_management_test?schema=public
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars
  API_PREFIX: /api/v1
  CORS_ORIGIN: http://127.0.0.1:4173
  NODE_ENV: test

jobs:
  api:
    name: Build + API/DB integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: task-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run test:integration

  web:
    name: Build task-web-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: task-web-ui/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3000/api/v1

  e2e:
    name: UI + API + DB e2e
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            task-api/package-lock.json
            task-web-ui/package-lock.json
      - name: Setup API
        working-directory: task-api
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Setup UI + Playwright
        working-directory: task-web-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3000/api/v1
      - name: Run e2e
        working-directory: task-web-ui
        run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_API_URL: http://127.0.0.1:3000
          PLAYWRIGHT_UI_URL: http://127.0.0.1:4173
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          CORS_ORIGIN: http://127.0.0.1:4173
