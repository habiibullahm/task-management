name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Build task-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: task-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  web:
    name: Build task-web-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: task-web-ui/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000/api/v1
