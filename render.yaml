# Render Blueprint — Dashboard → New → Blueprint → connect this repo
# Free tier notes: web services sleep after idle; free Postgres expires after 30 days.
# After deploy, set CORS_ORIGIN + APP_URL to the UI URL, VITE_API_BASE_URL to https://<api>/api/v1 (rebuild UI),
# and RESEND_API_KEY (optional EMAIL_FROM) so forgot-password emails actually send.
#
# IMPORTANT: API must use runtime: node (NOT Docker). Alpine Docker breaks Prisma (libssl.so.1.1).
# If the service was switched to Docker in the UI, set Runtime back to Node and clear Dockerfile path.

services:
  - type: web
    name: task-management-api
    runtime: node
    rootDir: task-api
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: LOG_LEVEL
        value: info

  - type: web
    name: task-management-ui
    runtime: static
    rootDir: task-web-ui
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: task-management-db
    plan: free
    databaseName: task_management_db
    user: task_management
